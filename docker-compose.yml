services:
  postgres:
    image: postgres:16-alpine
    container_name: jsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jsa
      POSTGRES_PASSWORD: jsa_password
      POSTGRES_DB: job_search_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsa -d job_search_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: jsa_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=${N8N_WEBHOOK_SECRET}
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jsa_api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://jsa:jsa_password@postgres:5432/job_search_agent?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Scraper runs non-headless and is usually run on a host with a display,
  # or headful-in-container via xvfb. Kept profile-gated so `up` doesn't start it.
  scraper:
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    container_name: jsa_scraper
    profiles: ["manual"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://jsa:jsa_password@postgres:5432/job_search_agent?schema=public
    volumes:
      - ./storage-state:/app/storage-state
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
